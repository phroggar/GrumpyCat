<!DOCTYPE html>
<html lang="de">

<!--
  ============================================================
  Grumpy Cat Chatbot — index.html
  ============================================================
  Eine dependency-free PWA mit sarkastischer Katzen-Persönlichkeit.
  Kein Build-Step. Keine Frameworks. Einfach öffnen und chatten.
  ============================================================
-->

<head>
  <!-- ─────────────────────────────────────────────
       CHARACTER ENCODING & VIEWPORT
  ───────────────────────────────────────────── -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ─────────────────────────────────────────────
       PRIMARY META
  ───────────────────────────────────────────── -->
  <title>Grumpy Cat Chat 😾</title>
  <meta name="description" content="Ein mürrischer Katzen-Chatbot mit trockenem Humor. Keine echte KI – nur echte Genervtheit." />
  <meta name="author" content="Grumpy Cat" />

  <!-- ─────────────────────────────────────────────
       OPEN GRAPH / SOCIAL SHARING
  ───────────────────────────────────────────── -->
  <meta property="og:title" content="Grumpy Cat Chat 😾" />
  <meta property="og:description" content="Ein mürrischer Katzen-Chatbot mit trockenem Humor." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yourusername.github.io/your-repo/" />

  <!-- ─────────────────────────────────────────────
       FAVICON
  ───────────────────────────────────────────── -->
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

  <!-- ─────────────────────────────────────────────
       PWA MANIFEST
  ───────────────────────────────────────────── -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a2e" />

  <!-- ─────────────────────────────────────────────
       STYLESHEET
  ───────────────────────────────────────────── -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- Skip link for keyboard users -->
  <a class="skip-link" href="#chat-input">Zum Eingabefeld springen</a>

  <!-- ─────────────────────────────────────────────
       SITE HEADER
  ───────────────────────────────────────────── -->
  <header class="site-header" role="banner">
    <div class="container">
      <span class="site-logo" aria-label="Grumpy Cat Chat">
        <span class="logo-icon" aria-hidden="true">😾</span>
        Grumpy Cat Chat
      </span>
      <!-- Gedulds-Anzeige -->
      <div class="patience-meter" aria-live="polite" aria-label="Geduld der Katze">
        <span class="patience-label">Geduld:</span>
        <span class="patience-bar" role="meter" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100">
          <span class="patience-fill" id="patience-fill"></span>
        </span>
        <span class="patience-text" id="patience-text">niedrig</span>
      </div>
    </div>
  </header>

  <!-- ─────────────────────────────────────────────
       MAIN CONTENT — CHAT
  ───────────────────────────────────────────── -->
  <main id="main-content" class="chat-main">
    <div class="chat-wrapper">

      <!-- Chatverlauf -->
      <section class="chat-window" aria-label="Chatverlauf" aria-live="polite" aria-relevant="additions">
        <ol class="chat-messages" id="chat-messages" role="list">
          <!-- Begrüßungsnachricht vom Bot -->
          <li class="chat-message chat-message--bot">
            <span class="chat-avatar" aria-hidden="true">😾</span>
            <div class="chat-bubble">
              <p>Oh. Du schon wieder. Was willst du?</p>
              <time class="chat-time" datetime="">Gerade eben</time>
            </div>
          </li>
        </ol>
      </section>

      <!-- Eingabebereich -->
      <div class="chat-input-area">
        <form class="chat-form" id="chat-form" autocomplete="off" novalidate>
          <label for="chat-input" class="sr-only">Nachricht eingeben</label>
          <input
            type="text"
            id="chat-input"
            class="chat-input"
            placeholder="Schreib was… wenn du musst."
            maxlength="200"
            autocomplete="off"
            spellcheck="true"
            aria-label="Nachricht an Grumpy Cat"
          />
          <button type="submit" class="btn btn--send" aria-label="Nachricht senden">
            <span aria-hidden="true">➤</span>
            <span class="sr-only">Senden</span>
          </button>
        </form>
        <p class="chat-hint">Tipp: Frag nach Hilfe, sag Hallo oder erzähl einen Witz. Erwarte nichts.</p>
      </div>

    </div>
  </main>

  <!-- ─────────────────────────────────────────────
       SITE FOOTER
  ───────────────────────────────────────────── -->
  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <p class="footer-copy">
        😾 Grumpy Cat Chat &copy; <span id="footer-year"></span> &mdash;
        Keine echte KI. Nur echte Genervtheit.
      </p>
    </div>
  </footer>

  <!-- ─────────────────────────────────────────────
       SERVICE WORKER REGISTRATION
  ───────────────────────────────────────────── -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('[SW] Registriert:', reg.scope))
          .catch(err => console.warn('[SW] Registrierung fehlgeschlagen:', err));
      });
    }
  </script>

  <!-- Haupt-JS -->
  <script src="js/main.js" defer></script>

</body>
</html>
